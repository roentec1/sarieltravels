<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Viajes Sariel Travels</title>
  <link rel="icon" type="image/jpeg" href="../assets/img/logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #0077B6;
      --primary-dark: #023E8A;
      --accent: #F4A261;
      --dark: #1A1A2E;
      --gray: #6C757D;
      --light: #F8F9FA;
      --success: #2A9D8F;
      --danger: #E63946;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #023E8A 0%, #0077B6 50%, #00B4D8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo img {
      height: 70px;
      margin: 0 auto 12px;
      border-radius: 12px;
    }
    .login-logo h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.4rem;
      color: var(--primary-dark);
    }
    .login-logo p {
      color: var(--gray);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--dark);
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #E9ECEF;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.2s;
      background: #F8F9FA;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(0,119,182,0.15);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,119,182,0.4);
    }
    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .error-msg {
      background: #FEE2E2;
      color: var(--danger);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }
    .back-link {
      text-align: center;
      margin-top: 24px;
    }
    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .demo-note {
      margin-top: 24px;
      padding: 14px;
      background: #EFF6FF;
      border-radius: 10px;
      font-size: 0.8rem;
      color: #1E40AF;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="../assets/img/logo.jpg" alt="Sariel Travels">
      <h1>Panel Administrativo</h1>
      <p>Viajes Sariel Travels</p>
    </div>
    
    <div class="error-msg" id="error-msg"></div>
    
    <form id="login-form">
      <div class="form-group">
        <label for="usuario">Usuario / Correo</label>
        <input type="text" id="usuario" name="usuario" required placeholder="admin" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="btn-submit">
        <i class="fas fa-sign-in-alt"></i> INICIAR SESIÓN
      </button>
    </form>
    
    <div class="demo-note">
      <strong>Modo demo:</strong> Usuario: <code>admin</code> / Contraseña: <code>sariel2026</code><br>
      Una vez configurado Google Apps Script, el login se validará contra la hoja USUARIOS.
    </div>
    
    <div class="back-link">
      <a href="../index.html"><i class="fas fa-arrow-left"></i> Volver al sitio</a>
    </div>
  </div>

  <script>
    // Credenciales demo (reemplazar por llamada a GAS en producción)
    const DEMO_USER = { usuario: 'admin', password: 'sariel2026' };
    
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const errorEl = document.getElementById('error-msg');
      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
      errorEl.style.display = 'none';
      
      // Simulación de delay
      await new Promise(r => setTimeout(r, 600));
      
      // En producción: llamar a CONFIG.API_URL con action=login
      // Por ahora validación local demo
      if (usuario === DEMO_USER.usuario && password === DEMO_USER.password) {
        sessionStorage.setItem('sariel_admin', JSON.stringify({
          usuario: usuario,
          nombre: 'Administrador',
          token: 'demo-' + Date.now(),
          loginAt: new Date().toISOString()
        }));
        window.location.href = 'dashboard.html';
      } else {
        errorEl.textContent = 'Usuario o contraseña incorrectos';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> INICIAR SESIÓN';
      }
    });
  </script>
</body>
</html>
